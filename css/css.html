<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        button {
            background: #be0202;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #23d5ab;
            transform: scale(1.1);
            background: linear-gradient(135deg,#00ffcc,#3366ff);
            box-shadow: 0 0 20px #00ffcc,
                        0 0 40px #3366ff,
                        0 0 60px #00ffcc;
        }
    </style>

</head>

<body>
    <div class="card">
        <button>Hover Me!</button>
    </div>
</body>

</html>
